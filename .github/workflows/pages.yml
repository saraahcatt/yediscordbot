name: Publicar site da Ye

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter código
        uses: actions/checkout@v6
      - name: Verificar conteúdo e políticas
        run: node scripts/security-check.mjs
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Empacotar apenas arquivos públicos
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar
        id: deployment
        uses: actions/deploy-pages@v4
